name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 10 * * 1" # segunda-feira: verifica as fontes oficiais de verdade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      banco:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: observatorio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      TESTE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/observatorio
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - name: Fontes oficiais (semanal, não bloqueia)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: uv run pytest -m fontes_reais

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:8000
      VITE_AUTOR_LINKEDIN: https://www.linkedin.com/in/exemplo
      VITE_AUTOR_EMAIL: exemplo@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run formatar:verificar
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  contrato:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: OpenAPI servido x contracts/api-openapi.yaml
        run: uv run pytest tests/contract/test_contrato_openapi.py -k rotas_documentadas

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
