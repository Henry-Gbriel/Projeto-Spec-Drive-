name: Coleta diária

# 06h17 em Brasília (09h17 UTC). Fora de :00 para reduzir atrasos do agendador do GitHub.
# Atenção: em repositórios públicos, agendamentos são desativados após 60 dias sem atividade
# (ver README, "Reativar a coleta agendada").
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      carga_completa:
        description: "Recoletar o histórico completo"
        type: boolean
        default: false

concurrency:
  group: coleta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      COLETOR_DATABASE_URL: ${{ secrets.COLETOR_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - name: Sincronizar catálogo
        run: uv run observatorio sincronizar-catalogo
      - name: Coletar, validar e publicar
        run: uv run observatorio coletar --todos ${{ inputs.carga_completa && '--carga-completa' || '' }}
      - name: Situação
        if: always()
        run: uv run observatorio situacao
