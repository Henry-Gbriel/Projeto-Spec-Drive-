# Catálogo de indicadores do Observatório do Real (FR-054).
# Fonte única de metadados: alimenta o banco (tratado.indicador), a API, o site e os CSV.
# Códigos de série verificados em 2026-10-22 (specs/001-observatorio-do-real/research.md).

indicadores:
  - codigo: ipca
    nome: IPCA — variação mensal
    descricao: >-
      Índice oficial de inflação do Brasil. Mede quanto variaram, em cada mês, os preços dos
      produtos e serviços consumidos pelas famílias.
    instituicao: IBGE
    codigo_serie: SIDRA tabela 1737, variável 63
    url_origem: https://sidra.ibge.gov.br/tabela/1737
    conector: sidra
    parametros_conector:
      tabela: 1737
      variavel: 63
      inicio_coleta: "1994-01"
      conferencia: {conector: sgs, codigo: 433}
    unidade: "% ao mês"
    frequencia_fonte: mensal
    frequencia_exibicao: mensal
    casas_decimais: 2
    natureza: real
    janela_revisao_meses: 3
    situacao_catalogo: ativo
    entrega: 1
    limite_inferior: -5
    limite_superior: 100
    ordem: 1

  - codigo: ipca_indice
    nome: IPCA — número-índice
    descricao: >-
      O IPCA acumulado desde dezembro de 1993, quando o índice vale 100. Serve para comparar o
      nível de preços entre duas datas.
    instituicao: IBGE
    codigo_serie: SIDRA tabela 1737, variável 2266
    url_origem: https://sidra.ibge.gov.br/tabela/1737
    conector: sidra
    parametros_conector:
      tabela: 1737
      variavel: 2266
      inicio_coleta: "1993-12"
    unidade: número-índice (dez/1993 = 100)
    frequencia_fonte: mensal
    frequencia_exibicao: mensal
    casas_decimais: 2
    natureza: real
    janela_revisao_meses: 3
    situacao_catalogo: ativo
    entrega: 1
    limite_inferior: 0
    limite_superior: 1000000
    ordem: 2

