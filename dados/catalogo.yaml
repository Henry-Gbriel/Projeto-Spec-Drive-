    descricao: >-
      Quantos reais são necessários para comprar um dólar, pela taxa de referência calculada
      pelo Banco Central. Média mensal das cotações de venda.
    instituicao: Banco Central do Brasil
    codigo_serie: SGS 3698
    url_origem: https://www3.bcb.gov.br/sgspub/consultarvalores/telaCvsSelecionarSeries.paint
    conector: sgs
    parametros_conector: {codigo: 3698, inicio_coleta: "1994-07"}
    unidade: R$ por US$
    frequencia_fonte: mensal
    frequencia_exibicao: mensal
    casas_decimais: 4
    natureza: real
    janela_revisao_meses: 2
    situacao_catalogo: aguardando_integracao
    entrega: 2
    limite_inferior: 0
    limite_superior: 100
    ordem: 3

