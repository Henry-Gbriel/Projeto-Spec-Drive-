[project]
name = "observatorio"
version = "0.1.0"
description = "Rotinas de dados e API pública do Observatório do Real"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "psycopg[binary,pool]>=3.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.scripts]
observatorio = "observatorio.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatorio"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ", "S"]
ignore = [
    "S101",  # assert é o idioma do pytest
    "S608",  # SQL montado apenas com identificadores internos, nunca com entrada do usuário
]

[tool.ruff.lint.flake8-bugbear]
# Idioma do FastAPI e do Typer: dependências e opções declaradas no valor padrão.
extend-immutable-calls = ["fastapi.Depends", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra -m 'not fontes_reais'"
markers = [
    "fontes_reais: consulta as fontes oficiais de verdade (rede); não roda por padrão",
    "integracao: precisa de um Postgres local (variável TESTE_DATABASE_URL)",
]
